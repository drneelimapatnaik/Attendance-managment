<!doctype html>
<!--
  EduTrack Tuition Suite — single HTML entry for web, PWA, Capacitor (Android/iOS)
  and Tauri (desktop). `viewport-fit=cover` enables safe-area insets on notched phones.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="EduTrack — attendance, batches, fees and performance management for tuition centres." />
    <meta name="theme-color" content="#0037b0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EduTrack · Tuition Suite</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>EduTrack needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
