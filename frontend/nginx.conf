# Serving the EduTrack web app: a single-page app with hashed assets.
#
# Two rules do most of the work:
#   · unknown paths fall back to index.html, because /students/42 is a client
#     route that nginx has no file for;
#   · hashed assets are immutable and index.html is never cached, so a deploy
#     takes effect on the next load instead of after a hard refresh.

# Cache-Control, decided by path. This is a map rather than a per-location
# add_header for a reason: an add_header anywhere in a location REPLACES every
# add_header inherited from the server, which silently drops the security
# headers below. Computing the value here keeps one add_header at server level.
map $uri $edutrack_cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=31536000, immutable";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress what benefits; the font and image formats here are already packed.
    # text/html is always compressed and cannot be listed.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css text/javascript application/javascript
                     application/json application/manifest+json image/svg+xml;

    add_header Cache-Control          $edutrack_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    # The app is not meant to be framed by anyone.
    add_header X-Frame-Options        DENY always;
    # A CSP belongs here too, but the per-tenant themes set CSS custom properties
    # inline, so a policy without 'unsafe-inline' for styles breaks theming
    # silently. Add one deliberately, with style-src 'self' 'unsafe-inline', and
    # test a branded tenant before shipping it.

    # Vite emits /assets/<name>-<hash>.<ext>. The hash changes when the content
    # does, so the map above caches these for a year. A miss must 404 rather
    # than fall through to index.html, or a renamed chunk returns HTML and the
    # browser reports a syntax error instead of a missing file.
    location /assets/ {
        access_log off;
        try_files  $uri =404;
    }

    # Vite writes source maps; they are useful for reading a production stack
    # trace and they expose your source. Uncomment to withhold them.
    # location ~ \.map$ { return 404; }

    location = /manifest.webmanifest {
        # nginx's mime.types has no .webmanifest entry, and a manifest served as
        # application/octet-stream stops the PWA being installable. An empty
        # `types` block plus default_type overrides the type for this one
        # location — declaring `types` at server level would discard the whole
        # inherited mime map and serve the JS bundle as octet-stream too.
        types { }
        default_type application/manifest+json;
    }

    # Everything else: a real file if there is one, index.html if not.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # If you terminate the API on this same hostname, uncomment this and point it
    # at the API service. That is what makes the relative VITE_API_URL=/api/v1
    # default work, and it removes CORS from the picture entirely.
    # location /api/ {
    #     proxy_pass       http://api:3000;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Health probe for orchestrators: cheap, and not an SPA fallback.
    location = /healthz {
        access_log   off;
        types        { }
        default_type text/plain;
        return       200 "ok\n";
    }
}
